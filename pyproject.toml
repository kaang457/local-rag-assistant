[project]
name = "ragassist"
version = "1.0.0"
description = "Local document assistant: hybrid retrieval over PDFs and spreadsheets, cited answers from a local LLM via Ollama"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "numpy>=2.0",
    "openpyxl>=3.1",
    "pypdf>=5.0",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["fpdf2", "pytest", "ruff"]

[project.scripts]
ragassist = "ragassist.__main__:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ragassist = ["web/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
